{% extends "base.html" %}
{% from "_iconos.html" import icono %}

{% block contenido %}
<section class="tarjeta" aria-labelledby="titulo-eliminar">
  <h2 id="titulo-eliminar">{{ icono('cerrar') }} ¿Eliminar «{{ doc.titulo }}»?</h2>
  <p>Se borrarán el documento y sus {{ n }} fragmentos. El asistente dejará de usarlos. No se puede deshacer.</p>
  <form method="post" action="/documentos/{{ doc.id }}/eliminar">
    <input type="hidden" name="confirmar" value="si">
    <div class="acciones" role="group" aria-label="Confirmar eliminación">
      <button type="submit">{{ icono('cerrar') }} Sí, eliminar</button>
      <a class="boton secundario" href="/documentos/{{ doc.id }}">No, volver</a>
    </div>
  </form>
</section>
{% endblock %}
