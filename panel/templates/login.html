{% extends "base.html" %}
{% from "_iconos.html" import icono %}

{% block clase_main %}pagina-login{% endblock %}

{% block contenido %}
<p class="subtitulo">Ingresa con tu cuenta de administradora.</p>

{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}

<div class="tarjeta">
  <div class="insignia-grande">{{ icono('candado') }}</div>
  <form method="post" action="/login" class="formulario">
    <p>
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}"
             autocomplete="username" required autofocus>
    </p>
    <p>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>
    </p>
    <p>
      <button type="submit">{{ icono('salir') }} Iniciar sesión</button>
    </p>
  </form>
</div>
{% endblock %}
